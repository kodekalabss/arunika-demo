<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Prototype Arunika Property Suite oleh Kodeka Labs. Semua data contoh.">
<title>Arunika Property Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: light canvas with white cards, like a presentation board (user reference: AssetGrid). A slim prototype strip sits on top. Console uses a row of pill tabs instead of a sidebar so each screen gets the full width for its board of cards. Web publik = hero with a 3D maket, live 3D site plan card, listing cards, type plans, KPR calculator. */
/* Reasons (R-31): cool grey canvas + white cards = calm presentation board; black pill = where you are and the main action; emerald = the one accent, used for charts, key totals and "Tersedia" (buyers read green as available), a deeper emerald wherever it carries white text; blue for booking, grey for sold, amber and red only for real problems; hatching = space not used yet (unspent RAB, remaining target), so it carries meaning instead of texture; 3D renders are shown as a maket (architectural model on a board), never as photos, because no real photos exist yet; Plus Jakarta Sans = Jakarta-made geometric sans close to the reference, calm in dense tables; a round button with an arrow opens the full screen behind a card. */
:root{
  --bg:#E9EDEB; --surface:#FFFFFF; --soft:#F3F6F4; --sunk:#E8EDEA; --line:#E0E6E2; --line-strong:#C6CFCA;
  --ink:#121615; --ink-2:#434B47; --ink-3:#5B6460;
  --brand:#121615; --brand-hover:#2C3330; --brand-ink:#FFFFFF;
  --accent:#16A06B; --accent-ink:#0B7148; --accent-soft:#D9F2E5; --accent-wash:#EBF7F1;
  --free:#0E8455; --book:#5868D8; --sold:#B4BCB8;
  --free-ink:#0B7148; --free-soft:#DDF3E7; --book-ink:#3D4CB5; --book-soft:#E6E9FC; --sold-ink:#4F5854; --sold-soft:#EDF0EE;
  --hook-soft:#F5EBBE; --hook-ink:#6B5000;
  --lot-free-ink:#FFFFFF; --lot-book-ink:#FFFFFF; --lot-sold-ink:#262B29;
  --good:#0B7148; --good-soft:#DDF3E7; --warn:#935200; --warn-mark:#E39A2D; --warn-soft:#FCEFD8; --bad:#B0322A; --bad-mark:#DB4A3C; --bad-soft:#FBE3DF;
  --hatch:#CDD6D1;
  --g-ground:#DFE6E2; --g-road:#C4CDC8; --g-park:#CBDFD0; --g-house:#FBFBF8; --g-fac:#D3DBD7; --g-water:#A9CFDE; --g-tree:#77AA8A; --g-trunk:#8D7C69;
  --scrim:rgba(18,22,21,.4);
  --shadow:0 1px 2px rgba(18,22,21,.04),0 10px 30px rgba(18,22,21,.05);
  --lift:0 2px 8px rgba(18,22,21,.08);
  --pop:0 24px 60px rgba(18,22,21,.18),0 4px 14px rgba(18,22,21,.08);
  --r-xs:8px; --r-sm:12px; --r:16px; --r-lg:22px; --r-xl:28px; --pill:999px;
  --f-sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
body.lock{overflow:hidden}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance;font-weight:600}
p{margin:0}
ul,ol,dl,dd,figure{margin:0;padding:0}
ul{list-style:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.ink2{color:var(--ink-2)} .ink3{color:var(--ink-3)} .small{font-size:13px} .nowrap{white-space:nowrap} .mute{color:var(--ink-3)}
.fine{font-size:12.5px;color:var(--ink-3);line-height:1.5}
.t-good{color:var(--good)} .t-bad{color:var(--bad)} .t-warn{color:var(--warn)}
.sq{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none;background:var(--line-strong)}
.sq.free{background:var(--free)} .sq.book{background:var(--book)} .sq.sold{background:var(--sold)}
.sq.good{background:var(--accent)} .sq.warn{background:var(--warn-mark)} .sq.bad{background:var(--bad-mark)} .sq.accent{background:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:3px 11px;border-radius:var(--pill);font-size:12.5px;font-weight:600;line-height:1.3;white-space:nowrap;background:var(--sunk);color:var(--ink-2)}
.tag.free,.tag.good{background:var(--free-soft);color:var(--free-ink)}
.tag.book{background:var(--book-soft);color:var(--book-ink)}
.tag.sold{background:var(--sold-soft);color:var(--sold-ink)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.hook{background:var(--hook-soft);color:var(--hook-ink)}
.tag.dark{background:var(--brand);color:var(--brand-ink)}
.tag.white{background:var(--surface);color:var(--ink);box-shadow:var(--lift)}
.tag.up{background:var(--surface);color:var(--accent-ink)}
.flag{display:inline-flex;align-items:center;min-height:24px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:var(--pill);background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap}
.flag.warn{background:var(--warn-soft);color:var(--warn)} .flag.good{background:var(--good-soft);color:var(--good)}
.note{background:var(--soft);border-radius:var(--r);padding:12px 14px;font-size:14px;line-height:1.5;color:var(--ink-2)}
.note .nl{display:block;font-size:12px;font-weight:700;color:var(--ink);margin-bottom:2px}
.note.ok{background:var(--good-soft)} .note.ok .nl{color:var(--good)}
.note.warn{background:var(--warn-soft)} .note.warn .nl{color:var(--warn)}
.note.bad{background:var(--bad-soft)} .note.bad .nl{color:var(--bad)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:rot .8s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.hatch{background-color:var(--soft);background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1.6px,transparent 1.6px 7px)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 20px;border-radius:var(--pill);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap;transition:background .15s,border-color .15s,color .15s;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2);padding-inline:12px}
.btn.quiet:hover{color:var(--ink);background:var(--soft)}
.btn.sm{min-height:34px;padding:6px 14px;font-size:13px}
.btn.full{width:100%}
.btn.demo{border-style:dashed;border-color:var(--ink-3);color:var(--ink-2);background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn .ico{width:17px;height:17px}
.btn .num{opacity:.8}
.lnk{background:none;border:0;padding:0;color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-align:left;font-size:inherit}
.chipbtn{display:inline-flex;align-items:center;min-height:34px;padding:6px 14px;border-radius:var(--pill);border:0;background:var(--soft);color:var(--ink-2);font-weight:500;font-size:13px;line-height:1.35;text-align:left}
.chipbtn:hover{background:var(--sunk);color:var(--ink)}
.lotbtn{display:inline-flex;align-items:center;gap:7px;min-height:32px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;padding:4px 12px 4px 10px;border-radius:var(--pill);border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.lotbtn:hover{border-color:var(--ink)}
.x{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);flex:none}
.x:hover{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.go{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--lift);text-decoration:none;transition:background .15s,color .15s,border-color .15s;padding:0}
.go:hover{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.go .ico{width:18px;height:18px}
@media (pointer:coarse){ .btn{min-height:44px} .btn.sm{min-height:40px} .x,.go{width:44px;height:44px} .chipbtn,.lotbtn{min-height:40px} }

/* prototype strip */
.chrome{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.chrome-in{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:10px 16px;min-height:58px;padding:8px max(24px,env(safe-area-inset-right,0px)) 8px max(24px,env(safe-area-inset-left,0px));flex-wrap:wrap}
.chrome .who{display:flex;align-items:baseline;gap:10px;font-size:13.5px;font-weight:700;min-width:0}
.chrome .who span{font-weight:500;color:var(--ink-3);font-size:12.5px}
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--surface);border-radius:var(--pill);box-shadow:var(--lift);margin-inline:auto}
.seg a{color:var(--ink-2);text-decoration:none;font-weight:600;font-size:13.5px;padding:7px 18px;border-radius:var(--pill);text-align:center;white-space:nowrap}
.seg a:hover{color:var(--ink);background:var(--soft)}
.seg a.on{background:var(--brand);color:var(--brand-ink)}
.chrome-r{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--ink-3)}
.chrome-r button{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:var(--pill);padding:6px 14px;font-size:12.5px;font-weight:600}
.chrome-r button:hover{border-color:var(--ink)}
@media (max-width:760px){
  .chrome .who span,.chrome-r .by{display:none}
  .chrome-r{margin-left:auto}
  .seg{order:3;width:100%;margin:0}
  .seg a{flex:1;padding-block:9px}
}

/* ---------- shared cards ---------- */
.card{background:var(--surface);border-radius:var(--r-xl);padding:20px 22px 22px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:16px;position:relative}
.card-h{display:flex;align-items:center;gap:12px;min-width:0;flex-wrap:wrap}
.card-h h2,.card-h h3{font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.card-h .r{margin-left:auto;display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.cnt{display:inline-flex;align-items:center;min-height:24px;padding:2px 10px;border-radius:var(--pill);background:var(--soft);font-size:12.5px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--ink-2);background:var(--surface)}
.ib .ico{width:19px;height:19px}
.lg{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.lg i{display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--accent)}
.lg i.lg-b{background:none;border-top:2px dashed var(--ink-3);height:0}
.lg i.lg-m{background:var(--ink);height:3px}
.lg i.lg-h{width:14px;height:10px;border-radius:3px;background-color:var(--soft);background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1.6px,transparent 1.6px 5px)}
.lg i.lg-a{height:10px;border-radius:3px}
.lg-row{display:flex;gap:8px 16px;flex-wrap:wrap}
.empty{padding:28px 20px;text-align:center;color:var(--ink-3);font-size:14px}

/* ---------- web publik ---------- */
.wrap{max-width:1380px;margin-inline:auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.pw-nav-in{display:flex;align-items:center;gap:16px;padding-block:22px 16px}
.brand{display:flex;flex-direction:column;gap:4px;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1}
.brand small{font-size:12.5px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.pw-links{display:flex;gap:6px;margin-inline:auto}
.pw-links button{height:42px;padding:0 18px;border-radius:var(--pill);border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 70%,transparent);font-weight:600;font-size:14px;color:var(--ink-2)}
.pw-links button:hover{background:var(--surface);color:var(--ink)}
.pw-saved{margin-left:auto}
.pw-links + .pw-saved{margin-left:0}
.hero{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:22px;align-items:stretch;padding-block:6px 6px}
.hero-l{display:flex;flex-direction:column;justify-content:space-between;gap:30px;padding:28px 4px 4px}
.hero h1{font-size:clamp(42px,5.5vw,80px);font-weight:500;letter-spacing:-.04em;line-height:.98}
.lede{font-size:17px;color:var(--ink-2);max-width:44ch;margin-top:20px}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.hero-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.hs{background:var(--surface);border-radius:var(--r-lg);padding:14px 16px 15px;box-shadow:var(--shadow);min-width:0}
.hs dt{font-size:12.5px;color:var(--ink-3)}
.hs dd{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums;margin-top:3px;white-space:nowrap}
.hs dd small{font-size:13px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.hero-r{position:relative;border-radius:var(--r-xl);overflow:hidden;min-height:540px;background:linear-gradient(180deg,#F5F8F6,#DCE5E0);box-shadow:var(--shadow)}
.hero-r img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 58%}
.hero-cap{position:absolute;top:18px;left:18px}
.hero-card{position:absolute;left:18px;bottom:18px;display:flex;align-items:center;gap:18px;background:var(--surface);border-radius:var(--r-lg);padding:14px 14px 14px 18px;box-shadow:var(--pop);max-width:calc(100% - 36px)}
.hero-card > div{display:flex;flex-direction:column;min-width:0}
.hero-card b{font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.hero-card span:last-child{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pw-sec{padding-block:56px 4px}
.sec-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 24px;flex-wrap:wrap;margin-bottom:20px}
.sec-t{font-size:clamp(30px,3.5vw,48px);font-weight:500;letter-spacing:-.035em;line-height:1.04}
.sec-t span{color:var(--ink-3)}
.sec-p{color:var(--ink-2);margin-top:12px;max-width:58ch;font-size:15.5px}
.sec-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* stage: shared by web and console */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:18px;align-items:start}
.stage-main{min-width:0;display:flex;flex-direction:column;gap:12px;background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow);padding:14px}
.stage-top{display:flex;justify-content:space-between;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:2px 2px 0}
.stage-hint{flex:1;min-width:0;font-size:13px;color:var(--ink-3)}
@media (max-width:720px){ .stage-hint{order:3;flex-basis:100%} }
.stage-view{position:relative;border-radius:var(--r-lg);overflow:hidden;background:linear-gradient(180deg,#EEF3F0,var(--g-ground));aspect-ratio:16/10}
.stage-view.flat{aspect-ratio:auto;background:var(--soft)}
.g3host{position:absolute;inset:0}
.g3canvas{display:block;width:100%;height:100%;cursor:grab;outline:none}
.g3canvas:active{cursor:grabbing}
.g3labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.g3lab{position:absolute;left:0;top:0;font-size:12px;font-weight:700;color:var(--ink);background:rgba(255,255,255,.92);padding:3px 11px;border-radius:var(--pill);white-space:nowrap;box-shadow:0 1px 4px rgba(18,22,21,.1)}
.g3lab.fac{font-weight:600;color:var(--ink-2)}
.g3tip{position:absolute;left:0;top:0;background:var(--brand);color:var(--brand-ink);font-size:12.5px;padding:5px 12px;border-radius:var(--pill);white-space:nowrap;box-shadow:var(--lift)}
.g3tip b{margin-right:5px}
.plan2d{padding:12px}
.sp-scroll{overflow-x:auto}
.siteplan{display:block;width:100%;height:auto;min-width:620px}
.boot{padding:96px 20px;text-align:center;color:var(--ink-3);font-size:14px}
.tools-r{display:flex;gap:6px}
.tool{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;font-weight:500;line-height:1;padding:0}
.tool:hover{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.seg-s{display:inline-flex;gap:3px;padding:4px;background:var(--soft);border-radius:var(--pill);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg-s button{border:0;background:transparent;height:36px;padding:0 15px;border-radius:var(--pill);font-weight:600;font-size:13.5px;color:var(--ink-2);white-space:nowrap;flex:none}
.seg-s button:hover{color:var(--ink);background:var(--surface)}
.seg-s button.on{background:var(--brand);color:var(--brand-ink)}
.sec-row .seg-s,.sec-tools .seg-s{background:var(--surface);box-shadow:var(--lift)}
.sec-row .seg-s button:hover,.sec-tools .seg-s button:hover{background:var(--soft)}
.compass{position:absolute;top:14px;right:14px;width:46px;height:46px;border-radius:50%;background:var(--surface);box-shadow:var(--lift);display:grid;place-items:center;transition:none}
.compass svg{width:28px;height:28px}
.compass .nd{fill:var(--bad-mark)} .compass .sd{fill:var(--line-strong)}
.stage-bar{display:flex;justify-content:space-between;align-items:center;gap:12px 24px;flex-wrap:wrap;padding:2px 6px 4px}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:4px 12px 4px 10px;border-radius:var(--pill);background:var(--soft)}
.legend b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.sun{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sun label{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.sun label .ico{width:17px;height:17px;color:var(--warn-mark)}
.sun label b{color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range].sunr{-webkit-appearance:none;appearance:none;width:230px;max-width:100%;height:8px;border-radius:var(--pill);background:linear-gradient(90deg,#F1C27F,#FFF2D6 50%,#F1C27F);outline-offset:6px}
input[type=range].sunr::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--brand);border:4px solid var(--surface);box-shadow:0 1px 4px rgba(18,22,21,.3)}
input[type=range].sunr::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--brand);border:4px solid var(--surface);box-shadow:0 1px 4px rgba(18,22,21,.3)}
.stage-note{max-width:none}
.sel-mini{display:none}
@media (max-width:1100px){
  .sel-mini{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 8px 8px 14px;background:var(--soft);border-radius:var(--pill)}
  .sm-l{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;min-width:0}
  .sm-l b{font-weight:700}
  .sm-l > span:last-child{color:var(--ink-2)}
}
.sp-land{fill:var(--g-ground)} .sp-road{fill:var(--g-road)} .sp-park{fill:var(--g-park)} .sp-fac{fill:var(--g-fac)}
.sp-lbl{fill:var(--ink-2);font-family:var(--f-sans);font-size:12px;font-weight:600}
.sp-road-lbl{fill:var(--ink-3);font-family:var(--f-sans);font-size:11px;font-weight:600}
.sp-cl{fill:var(--ink);font-family:var(--f-sans);font-size:13px;font-weight:700}
.sp-gate rect{fill:var(--ink-3)}

.appr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 22px;padding:16px 18px;border-radius:var(--r-lg);background:var(--soft)}
.appr-m{display:flex;flex-direction:column;gap:3px;min-width:0}
.appr-m b{font-size:15px;font-weight:600}
.appr-m > span{font-size:13.5px;color:var(--ink-3)}
.appr-m .note{margin-top:8px}
.appr .note:not(.ok):not(.warn):not(.bad){background:var(--surface)}
.appr-s{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:12px}
.appr-s .amt{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.appr-s .row{display:flex;gap:8px}
.kas{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px;align-items:stretch;flex:1}
.kas-c{display:flex;flex-direction:column;gap:6px;min-width:0}
.kas-s{display:flex;flex-direction:column;gap:12px}
.stat{border-radius:var(--r-lg);padding:16px;background:var(--soft);display:flex;flex-direction:column;gap:6px;flex:1;justify-content:space-between}
.stat > span:first-child{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.stat > span:first-child .ico{width:17px;height:17px}
.stat b{font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .tag{align-self:flex-start}
.stat.mint{background:var(--accent-soft)}
.stat.mint > span:first-child{color:var(--accent-ink)}
.mm-n{display:flex;align-items:baseline;gap:10px}
.mm-n b{font-size:40px;font-weight:600;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.mm-n span{font-size:13.5px;color:var(--ink-3)}
.minimap{display:block;width:100%;height:auto;border-radius:var(--r-lg)}
.mm{stroke:var(--g-ground);stroke-width:3;cursor:pointer;transition:opacity .15s}
.mm.free{fill:var(--free)} .mm.book{fill:var(--book)} .mm.sold{fill:var(--sold)}
.mm:hover{stroke:var(--brand);stroke-width:4}
.mm-cl{fill:var(--ink);font:700 30px var(--f-sans)}
.mm-l{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mm-l div{background:var(--soft);border-radius:var(--r);padding:9px 12px}
.mm-l b{display:block;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.mm-l span{font-size:12px;color:var(--ink-3)}
.bullets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end;padding:8px 0 2px;max-width:560px;width:100%;margin-inline:auto}
.bl{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.bl-t{position:relative;width:66px;height:210px;border-radius:var(--pill);margin-bottom:6px}
.bl-t i{position:absolute;left:0;right:0;bottom:0;border-radius:var(--pill);background:var(--free);display:flex;justify-content:center;padding-top:12px;min-height:40px}
.bl.warn .bl-t i{background:var(--warn-mark)}
.bl-tip{font-size:13px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.bl.warn .bl-tip{color:var(--ink)}
.bl-t b{position:absolute;left:-10px;right:-10px;height:3px;border-radius:2px;background:var(--ink);transform:translateY(50%)}
.bl-t b span{position:absolute;left:calc(100% + 6px);top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.bl-l{font-size:14px;font-weight:600}
.bl-s{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.askbar{display:flex;gap:8px}
.ask-in{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:1px solid var(--line-strong);border-radius:var(--pill);padding:0 6px 0 16px;background:var(--surface);min-height:46px}
.ask-in:focus-within{outline:2px solid var(--ink);outline-offset:0;border-color:transparent}
.ask-in .ico{color:var(--ink-3)}
.ask-in input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px;padding:10px 0}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.ans-box{background:var(--soft);border-radius:var(--r-lg);min-width:0}
.ans{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;padding:18px 20px;align-items:start}
.ans.solo{grid-template-columns:1fr}
.ans-l{display:flex;flex-direction:column;gap:10px;line-height:1.6;max-width:66ch}
.ans-l .note{background:var(--surface)}
.ans-q{font-size:13px;color:var(--ink-3)}
.ans-q b{color:var(--ink-2);font-weight:600}
.ans-load{display:flex;gap:10px;align-items:center;color:var(--ink-3);font-size:14px;padding:20px}
.ans-c{min-width:0;background:var(--surface);border-radius:var(--r);padding:14px}
.reveal > *{animation:rise .4s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 120ms)}
@keyframes rise{from{opacity:0;transform:translateY(5px)}}
.legend-s{display:flex;gap:14px;font-size:12.5px;color:var(--ink-2);margin-bottom:8px;flex-wrap:wrap}
.legend-s span{display:flex;align-items:center;gap:6px}
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.chart .tick{fill:var(--ink-3);font-family:var(--f-sans);font-size:12px}
.chart .s1{fill:var(--accent)}
.chart .mtd{opacity:.55}
.ac-bg{fill:var(--accent-wash)}
.ac-hl{stroke:var(--accent);stroke-width:1.4;opacity:.55}
.ac-a{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.ac-b{fill:none;stroke:var(--ink-3);stroke-width:1.6;stroke-dasharray:5 5}
.mk-l{stroke:var(--accent);stroke-width:2}
.mk-d{fill:var(--surface);stroke:var(--ink);stroke-width:3}
.mk-t rect{fill:var(--brand)}
.mk-t text{fill:var(--brand-ink);font:700 12.5px var(--f-sans)}
.ac-hit{fill:transparent;cursor:crosshair;outline:none}
.ac-hit:focus-visible{fill:rgba(18,22,21,.05)}
.gb-h{fill:var(--soft)} .gb-hl{stroke:var(--hatch);stroke-width:1.6}
.hbars{display:flex;flex-direction:column;gap:12px}
.hb{display:grid;grid-template-columns:minmax(96px,auto) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:13px}
.hb-l{color:var(--ink-2);white-space:nowrap}
.hb-t{height:12px;border-radius:var(--pill);overflow:hidden;background-color:var(--soft);background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1.5px,transparent 1.5px 6px)}
.hb-t i{display:block;height:100%;border-radius:var(--pill);background:var(--accent)}
.hb-t i.bad{background:var(--bad-mark)} .hb-t i.warn{background:var(--warn-mark)} .hb-t i.good{background:var(--free)}
.hb b{font-weight:600;font-variant-numeric:tabular-nums}
.sp-res{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--ink-2)}
.sp-res .k{color:var(--ink-3)}
.sp-res .q{font-weight:600;color:var(--ink)}

/* tables */
.tbl-wrap{overflow-x:auto;margin-inline:-22px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:12px;color:var(--ink-3);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft)}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl th:first-child,.tbl td:first-child{padding-left:22px}
.tbl th:last-child,.tbl td:last-child{padding-right:22px}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl .sub{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.tbl .sub .tag{margin-top:4px}
.tbl tr.click{cursor:pointer;outline:none}
.tbl tr.click:hover td,.tbl tr.click:focus-visible td{background:var(--soft)}
.tbl tr.sel td{background:var(--accent-wash)}
.tbl tr.new td{background:var(--accent-wash)}
.tbl td.id{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .tag{white-space:normal}
.tbl td.nowrap .tag{white-space:nowrap}
.prog{display:flex;align-items:center;gap:10px;min-width:150px}
.prog .bar{flex:1}
.prog span{font-weight:600;width:36px;text-align:right;font-variant-numeric:tabular-nums}

/* sales */
.prio{background:var(--accent-soft);box-shadow:none}
.prio .ib{background:var(--surface);border-color:transparent;color:var(--accent-ink)}
.prio-l{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.prio-i{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-lg);background:var(--surface);border:0;text-align:left;color:var(--ink);min-width:0}
.prio-i:hover{box-shadow:0 0 0 1px var(--accent)}
.prio-i > span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column}
.prio-i b{font-size:14.5px;font-weight:600}
.prio-i small{font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;background:var(--sunk);color:var(--ink-2);flex:none;letter-spacing:.02em}
.kb-wrap{overflow-x:auto;padding:2px 2px 8px;margin-inline:-2px}
.kb{display:grid;grid-template-columns:repeat(5,minmax(246px,1fr));gap:14px}
.kb-col{display:flex;flex-direction:column;gap:10px;min-height:260px;padding:12px;border-radius:var(--r-xl);background:color-mix(in srgb,var(--surface) 50%,transparent);border:1px solid var(--line)}
.kb-col h3{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;padding:4px 6px 6px}
.kb-col h3 small{margin-left:auto;font-weight:500;color:var(--ink-3);font-size:12.5px;font-variant-numeric:tabular-nums}
.kb-col h3 .cnt{background:var(--surface)}
.lead{background:var(--surface);border:0;border-radius:var(--r-lg);padding:14px;text-align:left;display:flex;flex-direction:column;gap:9px;width:100%;color:var(--ink);box-shadow:var(--shadow)}
.lead:hover{box-shadow:0 0 0 1px var(--line-strong),var(--shadow)}
.lead.new{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.lead-t{display:flex;align-items:center;gap:10px}
.lead-t .av{width:32px;height:32px;font-size:11.5px}
.lead-t b{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.3}
.score{font-size:12.5px;font-weight:700;min-height:26px;padding:3px 10px;border-radius:var(--pill);display:inline-flex;align-items:center;font-variant-numeric:tabular-nums;flex:none}
.score.hot{background:var(--good-soft);color:var(--good)} .score.warm{background:var(--warn-soft);color:var(--warn)} .score.cold{background:var(--sunk);color:var(--ink-2)}
.lead-m{font-size:13px;color:var(--ink-2)}
.lead-f{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-3)}
.lead .flag{align-self:flex-start}

/* proyek */
.cl-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cl-sum > div{background:var(--soft);border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cl-sum span{font-size:12.5px;color:var(--ink-3)}
.cl-sum b{font-size:24px;font-weight:600;letter-spacing:-.025em;line-height:1.15;font-variant-numeric:tabular-nums}
.cl-sum b small{font-size:13px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.cl-sum .tag{align-self:flex-start;margin-top:4px}
.photo{position:relative;border-radius:var(--r-lg);overflow:hidden;background:var(--sunk);aspect-ratio:400/260;max-width:100%}
.photo > svg,.photo > img{display:block;width:100%;height:100%;object-fit:cover}
.ph-sky{fill:#DCE7F0} .ph-ground{fill:#C7B596} .ph-brick{fill:#BD6548} .ph-mortar{fill:none;stroke:#E2CBB5;stroke-width:1}
.ph-col{fill:#A2ABAF} .ph-hole{fill:#56636B;opacity:.6} .ph-plaster{fill:#E8E1D5}
.ph-frame rect,.ph-frame path{fill:none;stroke:#C9CFD2;stroke-width:3}
.ph-scaf path{fill:none;stroke:#5B676F;stroke-width:3}
.ph-plan{fill:none;stroke:#5B676F;stroke-width:2;stroke-dasharray:6 6;opacity:.7}
.ph-truss{fill:none;stroke:#5B676F;stroke-width:3;stroke-linejoin:round}
.ph-roof{fill:#6E4436} .ph-sand{fill:#D6BA83} .ph-pile rect{fill:#A2ABAF}
.aibox{position:absolute;border:2px solid #FFFFFF;box-shadow:0 0 0 1px rgba(0,0,0,.35);border-radius:10px;pointer-events:none}
.aibox.no{border-style:dashed}
.aibox span{position:absolute;top:6px;left:6px;background:var(--brand);color:#FFFFFF;font-size:11px;font-weight:600;padding:3px 9px;border-radius:var(--pill);white-space:nowrap}
.photo-tag{position:absolute;left:12px;bottom:12px;background:var(--brand);color:#FFFFFF;font-size:12px;font-weight:600;padding:5px 12px;border-radius:var(--pill)}
.scan{position:absolute;inset:0;display:grid;place-items:center;background:rgba(18,22,21,.25);overflow:hidden}
.scan::before{content:"";position:absolute;left:0;right:0;height:30%;background:linear-gradient(180deg,transparent,rgba(255,255,255,.4),transparent);animation:sweep 1.1s linear infinite}
@keyframes sweep{from{top:-30%}to{top:100%}}
.scan span{position:relative;background:var(--surface);color:var(--ink);padding:8px 16px;border-radius:var(--pill);font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.ph-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ph-h h3{font-size:18px;margin-top:2px;letter-spacing:-.015em}
.est{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.est > div{background:var(--soft);border-radius:var(--r);padding:10px 12px}
.est dt{font-size:12px;color:var(--ink-3)}
.est dd{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.comps{display:flex;flex-wrap:wrap;gap:6px}
.comps li{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:var(--pill);background:var(--soft);color:var(--ink-3)}
.comps li.ok{background:var(--good-soft);color:var(--good)} .comps li.part{background:var(--warn-soft);color:var(--warn)}
.comps .sq{width:8px;height:8px}
.comps li.no .sq{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.verify{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 12px 12px 16px;border-radius:var(--r-lg);background:var(--soft);font-size:14px;font-weight:600}
.verify form{display:flex;gap:8px;align-items:center}
.verify .inp{width:90px;min-height:38px}
.stack{display:flex;flex-direction:column;gap:14px}
.mandor{gap:14px}
.mandor-h{display:flex;align-items:center;gap:12px}
.mandor-h > div{flex:1;min-width:0}
.mandor-h b{display:block;font-size:16px;font-weight:600}
.mandor-h span{font-size:12.5px;color:var(--ink-3)}
.mandor-k{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mandor-k > div{background:var(--soft);border-radius:var(--r);padding:10px 12px}
.mandor-k dt{font-size:12px;color:var(--ink-3)}
.mandor-k dd{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.mandor p{font-size:13.5px;color:var(--ink-2)}

/* finance */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.tile{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border-radius:var(--r-xl);padding:18px;box-shadow:var(--shadow);min-width:0}
.tile-t{display:flex;flex-direction:column;min-width:0}
.tile-t > span{font-size:12.5px;color:var(--ink-3)}
.tile-t b{font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1.15;font-variant-numeric:tabular-nums}
.tile-t small{font-size:12.5px;color:var(--ink-3)}
.tile-t small.warn{color:var(--warn)} .tile-t small.bad{color:var(--bad)}
.ledger{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.ledger > div{background:var(--soft);border-radius:var(--r-lg);padding:14px 16px;min-width:0}
.ledger dt{font-size:12.5px;color:var(--ink-3)}
.ledger dd{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.25;margin-top:2px}
.ledger dd small{font-size:13px;font-weight:500;color:var(--ink-3)}
.ledger span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.ledger span.warn{color:var(--warn)} .ledger span.bad{color:var(--bad)}
.anoms{display:flex;flex-direction:column;gap:10px}
.anoms li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 24px;padding:16px 18px;border-radius:var(--r-lg);background:var(--soft);align-items:start}
.anoms li.done{opacity:.6}
.anom-b{display:flex;flex-direction:column;gap:5px;min-width:0}
.anom-t{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.anom-b b{font-size:15px;font-weight:600}
.anom-b p{font-size:14px;color:var(--ink-2);max-width:82ch}
.anom-a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rules > div{background:var(--soft);border-radius:var(--r);padding:10px 14px}
.rules dt{font-size:12px;color:var(--ink-3)}
.rules dd{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.hist{display:flex;flex-direction:column;gap:6px;margin-top:6px;font-size:13px}
.hist li{display:flex;gap:10px}
.hist .t{color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.search-card{gap:12px}

@media (max-width:1180px){
  .cs-nav{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .ans{grid-template-columns:1fr}
  .prio-l{grid-template-columns:1fr}
}
@media (max-width:900px){
  .kas{grid-template-columns:1fr}
  .kas-s{flex-direction:row}
}
@media (max-width:760px){
  .cs{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:16px}
  .cs-top{margin-bottom:20px}
  .cs-top .sync small{display:none}
  .head-r{width:100%}
  .head-r .kpi{flex:1 1 200px}
  .card{padding:16px 16px 18px;border-radius:var(--r-lg)}
  .tbl-wrap{margin-inline:-16px}
  .tbl th:first-child,.tbl td:first-child{padding-left:16px}
  .tbl th:last-child,.tbl td:last-child{padding-right:16px}
  .kas-s{flex-direction:column}
  .cl-sum{grid-template-columns:1fr}
}
@media (max-width:560px){
  .appr{grid-template-columns:1fr}
  .appr-s{align-items:flex-start}
  .anoms li{grid-template-columns:1fr}
  .anom-a{justify-content:flex-start}
  .rules{grid-template-columns:1fr}
  .est dd{font-size:19px}
  .askbar{flex-direction:column}
  .bl-t{width:54px;height:180px}
  .bl-t b span{display:none}
  .mm-l{grid-template-columns:repeat(3,minmax(0,1fr))}
}

/* overlays */
.ov,.mwrap{position:fixed;inset:0;z-index:80;background:var(--scrim);animation:fade .2s ease}
.ov{display:flex;justify-content:flex-end}
.mwrap{display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.drawer{width:min(520px,calc(100% - 24px));height:calc(100% - 24px);margin:12px;border-radius:var(--r-xl);background:var(--bg);overflow-y:auto;box-shadow:var(--pop);animation:slide .26s cubic-bezier(.2,.7,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-h{position:sticky;top:0;z-index:2;background:var(--bg);padding:calc(20px + env(safe-area-inset-top,0px)) 18px 14px 22px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.drawer-h .k{font-size:12.5px;color:var(--ink-3)}
.drawer-h h2{font-size:24px;font-weight:600;letter-spacing:-.025em;margin-top:2px}
.drawer-h p{font-size:13.5px;color:var(--ink-2);margin-top:3px}
.drawer-b{padding:4px 14px 30px;display:flex;flex-direction:column;gap:12px}
.dsec{background:var(--surface);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.dsec h3{font-size:15px;font-weight:600}
.dsec .sub-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.steps span{position:relative;font-size:12px;font-weight:600;padding-top:12px;color:var(--ink-3)}
.steps span::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;border-radius:var(--pill);background:var(--sunk)}
.steps .done{color:var(--ink-2)} .steps .done::before{background:var(--accent)}
.steps .cur{color:var(--ink)} .steps .cur::before{background:var(--brand)}
.scorebox{display:flex;gap:16px;align-items:flex-start}
.score-big{font-size:36px;font-weight:600;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;flex:none;min-width:58px}
.score-big.hot{color:var(--good)} .score-big.warm{color:var(--warn)} .score-big.cold{color:var(--ink-3)}
.why{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--ink-2)}
.why li{display:flex;gap:9px}
.why li::before{content:"";flex:none;width:6px;height:6px;margin-top:8px;border-radius:2px;background:var(--accent)}
.wa{background:var(--soft);border-radius:var(--r-lg);padding:12px}
.wa-bubble{background:var(--surface);border-radius:var(--r-lg) var(--r-lg) var(--r-lg) 6px;padding:11px 14px;font-size:14px;line-height:1.55;min-height:44px;white-space:pre-wrap}
.docs li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.docs li:first-child{border-top:0}
.docs li > div{min-width:0}
.docs b{display:block;font-size:13.5px;font-weight:600}
.docs li > div span{display:block;font-size:12.5px;color:var(--ink-3)}
.docs .mk{width:16px;height:20px;display:grid;place-items:center;flex:none}
.docs li.fix > div span,.docs li.pend > div span{color:var(--warn)}
.docs li.missing > div span{color:var(--bad)}
.docs li.wait{opacity:.5}
.doc-sum{display:flex;gap:8px;flex-wrap:wrap}
.modal{width:min(540px,100%);max-height:100%;overflow:auto;background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--pop);animation:up .22s ease}
.modal.wide{width:min(740px,100%)}
.m-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:24px 20px 0 26px}
.m-h .k{font-size:12.5px;color:var(--ink-3)}
.m-h h2{font-size:21px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.m-b{padding:18px 26px 26px;display:flex;flex-direction:column;gap:16px}
.m-act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.m-act.pad{padding:0 26px 26px}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px;border-radius:var(--r);background:var(--soft)}
.sum b{font-size:19px;font-variant-numeric:tabular-nums}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--soft);border-radius:var(--pill)}
.pay label{display:flex;gap:8px;align-items:center;justify-content:center;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer;min-height:40px;border-radius:var(--pill)}
.pay label:has(input:checked){background:var(--surface);box-shadow:var(--lift)}
.pay input{accent-color:var(--brand)}
.err{font-size:13.5px;color:var(--bad);background:var(--bad-soft);padding:10px 14px;border-radius:var(--r)}
.done{padding:30px 28px 26px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.done h2{font-weight:600;font-size:28px;line-height:1.12;letter-spacing:-.03em}
.done p{color:var(--ink-2)}
.done .nup{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.demo-note{font-size:13.5px;line-height:1.55;border:1px dashed var(--ink-3);border-radius:var(--r);padding:12px 14px;color:var(--ink-2)}
.demo-note b{color:var(--ink)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--brand);color:var(--brand-ink);border-radius:var(--pill);padding:10px 10px 10px 20px;display:flex;gap:12px;align-items:center;box-shadow:var(--pop);width:max-content;max-width:min(580px,calc(100vw - 32px));font-size:14px;animation:up .22s ease}

@media (max-width:560px){ .drawer{width:100%;height:100%;margin:0;border-radius:0} .toast{border-radius:var(--r-lg)} }
/* Screen change: a short rise so the eye registers the new screen; skipped on first load and with reduced motion. */
.enter{animation:vt-in .3s cubic-bezier(.2,.7,.2,1)}

  if (/timur|barat|utara|selatan|hadap|matahari/.test(s)) { const dir = (s.match(/timur|barat|utara|selatan/) || ['timur'])[0]; const D = dir[0].toUpperCase() + dir.slice(1); const ls = S.lots.filter(l => l.status === 'free' && l.hadap === D); return ls.length ? bot(`Kavling hadap ${dir} yang masih tersedia saat ini ada ${ls.length}. Pilih nomornya untuk melihat di peta:`, {lots: ls.map(l => l.id).slice(0, 8), chips: ['Simulasi cicilan tipe 45', 'Berapa booking fee?']}) : bot(`Kavling hadap ${dir} sudah habis. Mau saya carikan tipe yang sama di sisi lain?`, {chips: CHAT_START}); }
  if (/booking|nup|tanda jadi/.test(s)) return bot('Booking fee Rp 5 juta. Begitu pembayaran terverifikasi, kavling langsung terkunci atas nama Anda selama 14 hari sambil berkas KPR diproses. Booking fee nanti dipotong dari uang muka.', {chips: ['Syarat KPR apa saja?', 'Kavling hadap timur yang masih ada?']});

  if (/cicil|kpr|angsur|bunga|\bdp\b|uang muka|simulasi/.test(s)) { const t = tipe || 45; const T = TYPES[t]; const r = kpr({harga: T.harga, dp: 20, tenor: 20, bank: 'a'}); return bot(`Contoh tipe ${t} (${rpS(T.harga)}), DP 20%, tenor 20 tahun di Bank Mitra A: cicilan sekitar ${rpS(r.m1)} per bulan selama tiga tahun pertama, lalu sekitar ${rpS(r.m2)} setelah bunga promo selesai. Penghasilan yang disarankan minimal ${rpS(r.income)} per bulan.`, {action: {label: 'Atur sendiri di kalkulator', act: 'scroll', to: 'pw-kpr'}, chips: ['Syarat KPR apa saja?', 'Berapa booking fee?']}); }
  if (/fasilitas|keamanan|aman|masjid|taman|kolam|clubhouse/.test(s)) return bot('Fasilitasnya: satu gerbang dengan satpam 24 jam, CCTV di jalan utama, masjid, clubhouse dengan kolam renang, taman bermain, dan jalur hijau untuk jogging. Semuanya terlihat di peta.', {chips: CHAT_START});
  if (/harga|tipe|berapa/.test(s)) return bot([36, 45, 54].map(t => `Tipe ${t}/${TYPES[t].lt}: mulai ${rpS(TYPES[t].harga)}, ${S.lots.filter(l => l.tipe === t && l.status === 'free').length} unit tersedia`).join('\n') + '\n\nKavling hook (sudut) sekitar 7% lebih mahal karena tanahnya lebih luas.', {chips: ['Simulasi cicilan tipe 45', 'Spesifikasi tipe 45']});
  return bot('Pertanyaan ini saya teruskan ke tim sales. Balasannya lewat WhatsApp di jam kerja, 09.00 sampai 17.00. Sementara itu, ada yang bisa saya bantu soal unit, harga, atau KPR?', {chips: CHAT_START});
}
function msgHTML(m, i) {
  const last = i === S.chat.msgs.length - 1;

function chatSend(q) {
  q = (q || '').trim(); if (!q || S.chat.typing) return;

/* ================= toast, typing, copy ================= */
let toastTimer;
function toast(msg, action) {
  const root = $('#toastRoot'); S.ui.toastFn = action ? action.fn : null;
  root.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${action ? `<button data-act="toastAct">${esc(action.label)}</button>` : ''}</div>`;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { root.innerHTML = ''; }, action ? 9000 : 5500);
}
function typeInto(sel, text, done) {
  const el = $(sel); if (!el) { done(); return; }
  if (reduceMotion) { el.textContent = text; done(); return; }
  let i = 0; const step = () => { if (!el.isConnected) { done(); renderOverlay(); return; } i = Math.min(text.length, i + 3); el.textContent = text.slice(0, i); if (i < text.length) setTimeout(step, 14); else done(); }; step();
}
function copyText(text, okMsg) {
  const fallback = () => toast('Browser menolak salin otomatis. Pilih teksnya lalu salin manual.');
  try { navigator.clipboard.writeText(text).then(() => toast(okMsg), fallback); } catch (e) { fallback(); }
}

  copyWA: el => { const l = leadById(el.dataset.id); copyText(l.wa, 'Pesan disalin. Tinggal tempel di WhatsApp.'); },
  checkDocs: el => {
    const l = leadById(el.dataset.id); l.docState = 'checking'; l.docProg = 0; renderOverlay();
    const tick = () => { if (S.leads.indexOf(l) < 0) return; l.docProg++; if (l.docProg >= DOCS.length) { l.docState = 'checked'; renderOverlay(); update(); return; } renderOverlay(); setTimeout(tick, 380); };
    setTimeout(tick, 380);
  },
  sendFix: el => { const l = leadById(el.dataset.id); l.docState = 'fixRequested'; l.fixAt = nowStr().slice(7); S.audits.unshift({t: nowStr(), who: SALES_USER[l.sales] || 'admin.demo', act: 'Minta koreksi berkas KPR', obj: `${l.lot}, ${l.name}`, auth: 'Lengkap', ok: true, isNew: true}); renderOverlay(); update(); toast('Permintaan koreksi terkirim ke WhatsApp pembeli (simulasi).'); },
  simResubmit: el => { const l = leadById(el.dataset.id); l.fixed = true; DOCS.forEach(([k]) => { l.docs[k] = 1; }); A.checkDocs(el); },
  submitBank: el => { const l = leadById(el.dataset.id); l.docState = 'submitted'; l.submittedAt = nowStr(); if (l.stage < 3) l.stage = 3; S.audits.unshift({t: nowStr(), who: 'spv.maya', act: 'Verifikasi dan ajukan berkas KPR', obj: `${l.lot}, ${l.name}`, auth: 'Diverifikasi supervisor', ok: true, isNew: true}); renderOverlay(); update(); toast(`Berkas ${l.name} diajukan ke bank.`); },
  pjSel: el => { S.ui.pjSel = el.dataset.id; S.ui.pjEdit = null; update(); },
  pjVerify: el => { const u = unitOf(el.dataset.id); u.verified = true; S.audits.unshift({t: nowStr(), who: 'pm.agus', act: 'Verifikasi estimasi progres', obj: `${u.id}, ${u.ai}%`, auth: 'Lengkap', ok: true, isNew: true}); update(); toast(`Estimasi ${u.id} ${u.ai}% diverifikasi.`); },
  pjAdjust: el => { S.ui.pjEdit = el.dataset.id; update(); setTimeout(() => { const i = $('#pjEditIn'); if (i) { i.focus(); i.select(); } }, 30); },
  pjCancelEdit: () => { S.ui.pjEdit = null; update(); },
  anomDone: el => { const a = S.anomalies.find(x => x.id === el.dataset.id); a.open = false; S.audits.unshift({t: nowStr(), who: 'finance.rani', act: 'Tinjau temuan', obj: a.title, auth: 'Lengkap', ok: true, isNew: true}); update(); },
  anomGo: el => {
    const a = S.anomalies.find(x => x.id === el.dataset.id); const g = a.go;
    if (g.scroll) { const t = document.getElementById(g.scroll); if (t) t.scrollIntoView({behavior: smooth, block: 'center'}); return; }
    if (g.pj) S.ui.pjSel = g.pj; if (g.cs) { S.ui.csSel = g.cs; S.ui.flash = g.cs; S.ui.csQuery = ''; S.ui.csInput = ''; } if (g.q) { S.ui.csQuery = g.q; S.ui.csInput = g.q; S.ui.csSel = null; }
    go(g.hash);
  },
};
function askRun(q) {
  q = (q || '').trim(); if (!q) return;
  S.ask = {q, key: askKey(q), loading: true, anim: false, input: ''}; update();
  setTimeout(() => { S.ask.loading = false; S.ask.anim = true; if (route() === 'dashboard') update(); setTimeout(() => { S.ask.anim = false; }, 1500); }, 900);
}
const F = {
  askForm: () => askRun($('#askIn').value),
  spForm: () => { const q = $('#spIn').value.trim(); S.ui.csQuery = q; S.ui.csInput = q; S.ui.csSel = null; update(); },
  chatForm: () => { const i = $('#chatIn'); const q = i.value; i.value = ''; chatSend(q); },
  bookForm: () => {
    const o = S.ui.overlay; const l = lot(o.lot); o.name = $('#bName').value.trim() || 'Pembeli web'; o.phone = $('#bPhone').value.trim();
    if (l.status !== 'free') { o.err = `Kavling ${l.id} baru saja dibooking pembeli lain. Pilih kavling lain di peta.`; renderOverlay(); return; }
    o.err = ''; o.step = 'paying'; renderOverlay();
    setTimeout(() => { const r = bookLot(l.id, {name: o.name, phone: o.phone, via: 'web'}); if (!r.ok) { o.step = 'form'; o.err = `Kavling ${l.id} baru saja dibooking pembeli lain.`; renderOverlay(); return; } o.step = 'done'; o.nup = r.nup; ovKey = ''; update(); }, 1200);
  },
  csBookForm: () => {
    const o = S.ui.overlay; const sel = $('#cbLead'); if (!sel) return; const ld = leadById(sel.value);
    const r = bookLot(o.lot, {name: ld.name, via: 'console', leadId: ld.id}); if (!r.ok) { renderOverlay(); return; }
    const id = o.lot; S.ui.overlay = null; S.ui.flash = id; S.ui.bookFor = null; update();
    toast(`${id} dibooking untuk ${ld.name}, ${r.nup}. Peta di web publik ikut berubah.`, {label: 'Lihat web publik', fn: () => { S.ui.pubSel = id; S.ui.pubTipe = 'all'; S.ui.flash = id; S.ui.scrollTo = 'pw-map'; go('#web'); }});
  },
  cancelForm: () => { const o = S.ui.overlay; const l = lot(o.lot); const reason = $('#cReason').value; l.cancelPending = true; S.audits.unshift({t: nowStr(), who: 'admin.demo', act: 'Ajukan pembatalan booking', obj: `${l.id}, ${l.nup}, ${reason}`, auth: 'Menunggu Sales Manager', ok: null, isNew: true}); S.ui.overlay = null; update(); toast(`Permintaan pembatalan ${l.id} dikirim ke Sales Manager. Kavling tetap terkunci.`); },
  pjEditForm: () => { const u = unitOf(S.ui.pjEdit); const v = clamp(Math.round(+$('#pjEditIn').value || 0), 0, 100); const old = u.ai; u.ai = v; u.verified = true; u.corrected = true; S.ui.pjEdit = null; S.audits.unshift({t: nowStr(), who: 'pm.agus', act: 'Koreksi estimasi dari foto', obj: `${u.id}, ${old}% menjadi ${v}%`, auth: 'Lengkap', ok: true, isNew: true}); update(); toast(`Estimasi ${u.id} dikoreksi ke ${v}% dan tercatat di jejak audit.`); },
};
function handlePhoto(file) {
  const u = unitOf(S.ui.pjSel) || S.units[0]; let src = '';
  try { src = URL.createObjectURL(file); } catch (e) { src = ''; }
  S.ui.pjPhoto = src ? {unit: u.id, src} : null; S.ui.pjAnalyzing = true; S.ui.pjEdit = null; update();
  setTimeout(() => {
    S.ui.pjAnalyzing = false; u.ai = Math.min(100, u.ai + 2); u.foto = '10 Nov'; u.verified = false;
    S.audits.unshift({t: nowStr(), who: 'lapangan.budi', act: 'Unggah foto progres', obj: `${u.id}, estimasi ${u.ai}%`, auth: 'Menunggu verifikasi PM', ok: null, isNew: true});
    if (route() === 'proyek') update(); toast(`Foto ${u.id} sudah dibaca: estimasi ${u.ai}%. Menunggu verifikasi Manajer Proyek.`);
  }, 1800);
}

/* ================= event wiring ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'closeOvBg') { if (e.target === el) closeOv(); return; }
  const fn = A[act]; if (!fn) return; e.preventDefault(); fn(el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.ui.overlay) closeOv(); else if (S.chat.open) A.closeChat(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('g[data-act], tr[data-act]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', {bubbles: true})); }
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && e.target.matches && e.target.matches('[role="tab"]')) { const order = [36, 45, 54]; const i = order.indexOf(S.ui.typeTab); const n = order[(i + (e.key === 'ArrowRight' ? 1 : 2)) % 3]; A.typeTab({dataset: {v: n}}); }
  if (e.key === 'Tab' && S.ui.overlay) { const box = $('#ovRoot .drawer, #ovRoot .modal'); if (!box) return; const f = [...box.querySelectorAll('button:not([disabled]),input:not([disabled]),select,textarea,[tabindex="0"]')]; if (!f.length) return; const first = f[0], last = f[f.length - 1]; if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } }
});
document.addEventListener('pointerover', e => { const t = e.target.closest && e.target.closest('.ac-hit'); if (t) acFocus(t); });
document.addEventListener('submit', e => { e.preventDefault(); const f = F[e.target.id]; if (f) f(e.target); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'kDp') { S.kpr.dp = +t.value; $('#kDpV').textContent = S.kpr.dp + '%'; $('#kprOut').innerHTML = kprOut(); }
  else if (t.classList && t.classList.contains('sunr')) { S.ui.sunT = +t.value; const hh = Math.floor(S.ui.sunT), mm = Math.round((S.ui.sunT - hh) * 60); const lbl = `${pad2(hh)}.${pad2(mm)}`; const v = document.getElementById('sunV-' + t.dataset.m); if (v) v.textContent = lbl; t.setAttribute('aria-valuetext', 'Jam ' + lbl); const n = $('#sunNote'); if (n) n.textContent = sunNote(S.ui.sunT); G3.setSun(S.ui.sunT); }
  else if (t.id === 'askIn') S.ask.input = t.value;
  else if (t.id === 'spIn') S.ui.csInput = t.value;
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'kLot') { S.kpr.lot = t.value; $('#kprOut').innerHTML = kprOut(); }
  else if (t.name === 'kBank') { S.kpr.bank = t.value; $('#kprOut').innerHTML = kprOut(); document.querySelectorAll('.bank').forEach(b => b.classList.toggle('on', b.querySelector('input').checked)); }
  else if (t.id === 'photoIn' && t.files && t.files[0]) handlePhoto(t.files[0]);
});

update();
})();
</script>
